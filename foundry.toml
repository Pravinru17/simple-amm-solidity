[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]

solc_version = "0.8.20"

optimizer = true
optimizer_runs = 200
via_ir = true

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 100
depth = 100
fail_on_revert = false

[profile.ci]
fuzz.runs = 10000
invariant.runs = 1000